---
extends: default

ignore: |
  .git/
  .venv/
  node_modules/
  dist/
  build/

rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0

  colons:
    max-spaces-before: 0
    max-spaces-after: 1

  commas:
    max-spaces-before: 0
    min-spaces-after: 1
    max-spaces-after: 1

  comments:
    min-spaces-from-content: 1

  comments-indentation: enable

  document-start:
    present: true

  document-end:
    present: false

  empty-lines:
    max: 2
    max-start: 0
    max-end: 1

  hyphens:
    max-spaces-after: 1

  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  key-duplicates: enable

  line-length:
    max: 100
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  new-line-at-end-of-file: enable

  new-lines:
    type: unix

  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true

  trailing-spaces: enable

  truthy:
    allowed-values:
      - "true"
      - "false"
    check-keys: true
