[project]
name = "tandemn-worker"
version = "0.0.1"
description = "The code for the GPU worker containers that will live on the accelerated nodes in Kubernetes."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.2,<2",
    "fastapi",
    "googleapis-common-protos",
    "grpcio>=1.83.0,<2",
    "grpcio-status>=1.83.0,<2",
    "httpx",
    "prometheus-client",
    "protobuf>=7.35.1,<8",
    "s3transfer>=0.10,<1",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.83.0",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-grpcio",
    "types-grpcio-status",
    "types-protobuf",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["src/tandemn/chunkmanager/v1/chunk_manager_pb2*"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # Ruff-specific rules
    "N", #pep8-naming
    "W", #pycodestyle warnings rules
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
exclude = ["^src/tandemn/chunkmanager/v1/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore.*",
    "google.rpc.error_details_pb2",
    "s3transfer.*",
    "tandemn.chunkmanager.v1.chunk_manager_pb2",
    "tandemn.chunkmanager.v1.chunk_manager_pb2_grpc",
]
follow_imports = "skip"
ignore_missing_imports = true
