---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: pp-test
  namespace: tandemn-system

spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: None

    leaderTemplate:
      metadata:
        labels:
          tandemn.com/job-type: batched-inference
          tandemn.com/job-id: "00000000000000000000000001"
          tandemn.com/rank-id: "00000000000000000000000001"
          tandemn.com/chain-id: "1"
      spec:
        terminationGracePeriodSeconds: 90

        nodeSelector:
          cloud.google.com/gke-nodepool: g2-standard-12

        containers:
          - name: tandemn-batched-leader
            image: "us-docker.pkg.dev/tandemn/tandemn-worker/tandemn-worker:v0.0.1-vllm0.28.0"
            imagePullPolicy: IfNotPresent
            env:
              - name: TD_VLLM_MODEL
                value: "microsoft/phi-4"
              - name: TD_VLLM_HOST
                value: "0.0.0.0"
              - name: TD_VLLM_EXTRA_ARGS
                value: >-
                  --pipeline-parallel-size=2  --nnodes $(LWS_GROUP_SIZE) --node-rank
                  $(LWS_WORKER_INDEX) --master-addr $(LWS_LEADER_ADDRESS)
              - name: TD_CHUNK_MANAGER_ADDRESS
                value: "${TD_CHUNK_MANAGER_ADDRESS}"
              - name: TD_JOB_ID
                valueFrom:
                  fieldRef:
                    fieldPath: "metadata.labels['tandemn.com/job-id']"
              - name: TD_RANK_ID
                valueFrom:
                  fieldRef:
                    fieldPath: "metadata.labels['tandemn.com/rank-id']"
              - name: TD_CHAIN_ID
                valueFrom:
                  fieldRef:
                    fieldPath: "metadata.labels['tandemn.com/chain-id']"

              - name: AWS_DEFAULT_REGION
                value: "${AWS_DEFAULT_REGION}"

            envFrom:
              - secretRef:
                  name: tandemn-worker-secrets
                  optional: false

            ports:
              - name: metrics
                containerPort: 9000
              - name: vllm
                containerPort: 8000

            resources:
              requests:
                cpu: "1"
                memory: 16Gi
                nvidia.com/gpu: "1"
              limits:
                nvidia.com/gpu: "1"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi

    workerTemplate:
      spec:
        nodeSelector:
          cloud.google.com/gke-nodepool: g2-standard-12
        containers:
          - name: tandemn-batched-worker
            image: docker.io/vllm/vllm-openai:v0.28.0@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
            command:
              - sh
              - -c
              - >-
                vllm serve microsoft/phi-4 --pipeline-parallel-size 2  --nnodes $(LWS_GROUP_SIZE)
                --node-rank $(LWS_WORKER_INDEX) --master-addr $(LWS_LEADER_ADDRESS)
                --headless
            resources:
              requests:
                nvidia.com/gpu: "1"
              limits:
                nvidia.com/gpu: "1"
            volumeMounts:
              - mountPath: /dev/shm
                name: dshm
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
